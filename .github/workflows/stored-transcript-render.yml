name: Stored transcript render regression
on:
  pull_request:
    paths:
      - 'clip_completion.py'
      - 'telegram_intake.py'
      - 'main.py'
      - 'tests/test_stored_transcript_render.py'
      - '.github/workflows/stored-transcript-render.yml'
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install video tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Test stored transcript rendering
        run: python tests/test_stored_transcript_render.py -v
