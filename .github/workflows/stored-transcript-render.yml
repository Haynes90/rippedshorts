name: Stored transcript render regression
on:
  pull_request:
    paths:
      - 'clip_completion.py'
      - 'boundary_specification.py'
      - 'google_drive.py'
      - 'tests/test_retained_preview_upload.py'
      - 'tests/test_preview_vertical_slice.py'
      - 'tests/test_sentence_first_construction.py'
      - 'tests/test_preview_playback_contract.py'
      - 'clip_review_ui.py'
      - 'tests/test_completion_cache_expiry.py'
      - 'finished_clip_review.py'
      - 'caption_review_web.py'
      - 'clip_review_ui.py'
      - 'clip_review_state.py'
      - 'tests/test_boundary_specification.py'
      - 'render_recovery.py'
      - 'tests/test_request_scoped_render_recovery.py'
      - 'telegram_intake.py'
      - 'tests/test_held_source_retention.py'
      - 'main.py'
      - 'production_intelligence.py'
      - 'intelligence_workflow.py'
      - 'hierarchical_intelligence.py'
      - 'tests/test_hierarchical_intelligence.py'
      - 'tests/test_conversation_relationships.py'
      - 'tests/test_chronological_topics.py'
      - 'tests/test_optional_intelligence_fallback.py'
      - 'tests/test_intelligence_orchestration.py'
      - 'tests/test_semantic_boundary_recovery.py'
      - 'tests/test_topic_map_reference_contract.py'
      - 'tests/test_stored_transcript_render.py'
      - '.github/workflows/stored-transcript-render.yml'
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install video tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Test stored transcript rendering
        run: python tests/test_stored_transcript_render.py -v
  topic-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install focused test dependencies
        run: python -m pip install pytest fastapi httpx google-api-python-client requests yt-dlp imageio-ffmpeg
      - name: Install existing video verification tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Test bounded topic references and durable diagnostics
        env:
          DATA_DIR: ${{ runner.temp }}/topic-contract-data
          PYTHONPATH: .
          PREVIEW_ACCEPTANCE_EXPORT_DIR: ${{ runner.temp }}/preview-acceptance-evidence
        run: python -m pytest tests/test_topic_map_reference_contract.py tests/test_semantic_boundary_recovery.py tests/test_production_intelligence.py tests/test_retry_loop_prevention.py tests/test_hierarchical_intelligence.py tests/test_conversation_relationships.py tests/test_chronological_topics.py tests/test_optional_intelligence_fallback.py tests/test_held_source_retention.py tests/test_request_scoped_render_recovery.py tests/test_clip_completion.py tests/test_boundary_specification.py tests/test_retained_preview_upload.py tests/test_preview_vertical_slice.py tests/test_completion_cache_expiry.py tests/test_sentence_first_construction.py tests/test_preview_playback_contract.py -q
      - uses: actions/upload-artifact@v4
        with:
          name: synthetic-preview-website-evidence
          path: ${{ runner.temp }}/preview-acceptance-evidence
          retention-days: 3

