name: Codebase index smoke test

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  index-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned indexer
        run: python -m pip install "codebase-index[watch]==2.1.3"
      - name: Preflight parser and exercise indexing
        run: |
          git rev-parse HEAD
          export XDG_CACHE_HOME="$(mktemp -d "$RUNNER_TEMP/codebase-index-cache.XXXXXX")"
          python -c "from tree_sitter_language_pack import cache_dir, get_parser; get_parser('python'); print('Python parser ready:', cache_dir())"
          python - <<'PY'
          import json
          import os
          import subprocess
          import tempfile
          import time
          from pathlib import Path

          source = Path("audio_master_handoff.py")
          symbol = "normalize_sermon"
          caller = "process_handoff"

          def index(*args):
              return json.loads(subprocess.check_output(["codebase-index", "--json", *args]))

          build = index("index", "--rebuild")
          print("Index build:", build, flush=True)
          assert build["parse_failed"] == 0, build
          findings = index("doctor")["findings"]
          assert all(item["ok"] for item in findings if item["severity"] == "high"), findings
          assert any(item["id"] == "symbol_extraction" and item["ok"] for item in findings), findings

          results = index("search", "Audio Master handoff")["results"]
          assert any(item["path"] == source.as_posix() for item in results), results
          definitions = index("symbol", symbol)["symbols"]
          assert any(item["name"] == symbol and item["path"] == source.as_posix()
                     for item in definitions), definitions
          sites = index("refs", symbol)["sites"]
          assert any(item["kind"] == "call" and item["caller"] == caller
                     and item["path"] == source.as_posix() for item in sites), sites
          print(f"Verified {caller} calls {symbol} in {source}", flush=True)

          original = source.read_bytes()

          def insert_probe(name):
              source.write_bytes(original + f"\n\ndef {name}():\n    return None\n".encode())

          def indexed_probe(name):
              result = index("symbol", name)
              return any(
                  item["name"] == name and item["path"] == source.as_posix()
                  for item in result["symbols"]
              )

          manual = "codebase_index_manual_refresh_probe"
          watched = "codebase_index_watch_refresh_probe"
          try:
              insert_probe(manual)
              freshness = next(item for item in index("doctor")["findings"] if item["id"] == "index_fresh")
              assert not freshness["ok"], freshness
              update = index("update")
              assert update["indexed"] >= 1 and indexed_probe(manual), update
              print("Manual update indexed the temporary symbol", flush=True)
              source.write_bytes(original)
              index("update")

              with tempfile.NamedTemporaryFile() as log:
                  with subprocess.Popen(
                      ["codebase-index", "watch", "--debounce", "500"],
                      stdout=log, stderr=subprocess.STDOUT,
                      env={**os.environ, "PYTHONUNBUFFERED": "1"},
                  ) as watch:
                      try:
                          deadline = time.monotonic() + 20
                          while time.monotonic() < deadline and watch.poll() is None:
                              if "[watch] watching" in Path(log.name).read_text(encoding="utf-8"):
                                  break
                              time.sleep(0.2)
                          else:
                              raise AssertionError("Index watcher did not start")
                          insert_probe(watched)
                          deadline = time.monotonic() + 20
                          # Poll the log outside the checkout so index reads do not reset the debounce.
                          while time.monotonic() < deadline and watch.poll() is None:
                              output = Path(log.name).read_text(encoding="utf-8")
                              if "[watch] updated " in output:
                                  break
                              time.sleep(0.2)
                          else:
                              raise AssertionError(Path(log.name).read_text(encoding="utf-8"))
                          assert indexed_probe(watched), "Watcher did not index the temporary symbol"
                          print("Watcher indexed the temporary symbol", flush=True)
                      finally:
                          if watch.poll() is None:
                              watch.terminate()
          finally:
              source.write_bytes(original)
              index("update")
              subprocess.run(["git", "diff", "--exit-code", "HEAD", "--", str(source)], check=True)

          assert not index("symbol", manual)["symbols"]
          assert not index("symbol", watched)["symbols"]
          freshness = next(item for item in index("doctor")["findings"] if item["id"] == "index_fresh")
          assert freshness["ok"], freshness
          print("Source and index restored", flush=True)
          PY
